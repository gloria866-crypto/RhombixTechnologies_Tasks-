<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local preview for Gloria's cloud photo gallery." />
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Gloria's collection</p>
        <h1>My Photo Gallery</h1>
        <p>Choose a photo to preview it in your gallery.</p>
      </header>

      <section class="upload-panel" aria-labelledby="upload-heading">
        <h2 id="upload-heading">Add a photo</h2>
        <form id="photo-form">
          <label class="file-picker" for="photo-input">
            <span>Choose Photo</span>
            <input id="photo-input" name="photo" type="file" accept="image/*" required />
          </label>
          <span id="file-name" class="file-name">No photo selected</span>

          <label>
            Title
            <input id="title-input" name="title" type="text" maxlength="80" placeholder="e.g. Beach sunset" required />
          </label>
          <label>
            Category
            <input id="category-input" name="category" type="text" maxlength="40" placeholder="e.g. Travel" required />
          </label>
          <button type="submit">Upload</button>
        </form>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="gallery-heading">
        <div class="gallery-heading">
          <h2 id="gallery-heading">Your Gallery</h2>
          <p id="photo-count">No photos yet</p>
        </div>
        <div id="gallery" class="gallery" aria-live="polite"></div>
        <p id="empty-state" class="empty-state">Your selected photos will appear here.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
