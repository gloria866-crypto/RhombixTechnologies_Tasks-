name: Frontend Validate

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Check static frontend files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm required files exist
        run: test -f frontend/index.html && test -f frontend/style.css && test -f frontend/app.js

      - name: Check JavaScript syntax
        run: node --check frontend/app.js
